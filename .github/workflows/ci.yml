name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - name: Install Chromium and Japanese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check the built reader in desktop and mobile Chromium
        run: npm run test:e2e
      - name: Upload browser screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reader-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
