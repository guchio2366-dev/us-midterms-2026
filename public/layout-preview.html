<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表示検証</title>
<style>
  body { margin: 12px; font: 16px sans-serif; background: #e7ecee; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button { min-height: 44px; padding: 10px; font: inherit; }
  iframe { display: block; border: 1px solid #7c8a91; background: white; }
  output { padding: 10px; }
</style>
<nav aria-label="表示の検証">
  <button data-size="390,844">390 × 844</button>
  <button data-size="768,1024">768 × 1024</button>
  <button data-size="943,600">943 × 600</button>
  <button data-size="944,600">944 × 600</button>
  <button data-size="1024,768">1024 × 768</button>
  <button data-size="1180,820">1180 × 820</button>
  <button data-size="1366,1024">1366 × 1024</button>
  <button data-size="1366,768">1366 × 768</button>
  <button data-size="1920,1080">1920 × 1080</button>
  <button data-size="2560,1440">2560 × 1440</button>
  <button id="text-size">文字を200%にする</button>
  <output id="size">1024 × 768</output>
</nav>
<iframe id="preview" title="中間選挙サイトの表示" width="1024" height="768" src="./"></iframe>
<script>
  const frame = document.getElementById('preview');
  document.querySelectorAll('[data-size]').forEach(button => {
    button.onclick = () => {
      const [width, height] = button.dataset.size.split(',');
      frame.width = width;
      frame.height = height;
      document.getElementById('size').textContent = `${width} × ${height}`;
    };
  });
  document.getElementById('text-size').onclick = () => {
    frame.contentDocument.documentElement.style.fontSize = '200%';
  };
</script>
</html>
