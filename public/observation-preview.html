<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>表示検証</title><style>body{margin:12px;font:16px sans-serif;background:#e7ecee}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{padding:10px;font:inherit}iframe{display:block;border:1px solid #7c8a91;background:white}output{padding:10px}</style><nav aria-label="表示の検証"><button data-size="390,844">390 × 844</button><button data-size="768,1024">768 × 1024</button><button data-size="1024,768">1024 × 768</button><button id="text-size">文字を200%にする</button><output id="size">1024 × 768</output></nav><iframe id="preview" title="中間選挙サイトの表示" width="1024" height="768" src="./"></iframe><script>
const frame=document.getElementById('preview');
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;document.getElementById('size').textContent=w+' × '+h;});
document.getElementById('text-size').onclick=()=>{const doc=frame.contentDocument;const sizes=[...doc.querySelectorAll('body *')].map(e=>[e,parseFloat(frame.contentWindow.getComputedStyle(e).fontSize)]);sizes.forEach(([e,size])=>e.style.setProperty('font-size',size*2+'px','important'));};
</script></html>
